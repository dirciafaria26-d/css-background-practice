<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webpage with Background Color and Image</title>
    <!-- Link external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main heading -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- Webpage description paragraph -->
    <p class="description">This webpage demonstrates the use of background colors and background images using CSS.</p>

    <!-- Important div container with background image and centered text -->
    <div class="important-box">
        <h2>Important Notice</h2>
        <p>
            This container utilizes the <code>background-image</code> property to set an image background, 
            and all inner content is centered using CSS <code>text-align: center</code>.
        </p>
    </div>

</body>
</html>
